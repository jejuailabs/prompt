name: TRELLIS Blackwell worker image
on:
  push:
    branches: [codex/3d-unity-pipeline]
    paths:
      - runpod-workflows/trellis-worker/**
      - .github/workflows/trellis-worker-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: trellis-worker-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Release hosted runner space
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          docker system prune -af
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: runpod-workflows/trellis-worker
          push: true
          tags: ghcr.io/jejuailabs/playlab-trellis-blackwell:${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=trellis-blackwell
          cache-to: type=gha,scope=trellis-blackwell,mode=max
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/jejuailabs/playlab-trellis-blackwell@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
