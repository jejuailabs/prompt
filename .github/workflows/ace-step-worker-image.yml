name: ACE-Step XL-Turbo worker image
on:
  push:
    branches: [main, codex/3d-unity-pipeline]
    paths:
      - runpod-workflows/ace-step-worker/**
      - .github/workflows/ace-step-worker-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ace-step-worker-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: runpod-workflows/ace-step-worker
          push: true
          tags: ghcr.io/jejuailabs/playlab-ace-step-xl:${{ github.sha }}
          provenance: false
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/jejuailabs/playlab-ace-step-xl@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
