name: SkinTokens rigging worker image
on:
  push:
    branches: [codex/3d-unity-pipeline]
    paths:
      - runpod-workflows/rigging-worker/**
      - runpod-workflows/character-worker/**
      - .github/workflows/rigging-worker-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: runpod-workflows/rigging-worker/Dockerfile
          push: true
          tags: ghcr.io/jejuailabs/playlab-skintokens:${{ github.sha }}
          provenance: false
      - name: Record image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/jejuailabs/playlab-skintokens@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
