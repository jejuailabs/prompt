<!doctype html><html lang="ko"><meta charset="utf-8"><title>PLAYLAB 3D 생성 검증</title>
<script type="module" src="/model-viewer.min.js"></script>
<style>body{margin:0;font:16px system-ui;background:#eef0f5;color:#172033}main{max-width:1000px;margin:30px auto}model-viewer{width:100%;height:650px;background:white;border-radius:20px}#state{padding:12px}</style>
<main><h1>TRELLIS.2 실제 생성 결과</h1><p>입력 이미지를 표시한 것이 아닌, 생성된 3D 메시입니다. 드래그해 회전하고 휠로 확대하세요.</p>
<model-viewer id="model" src="/model.glb" alt="생성된 3D 에셋" camera-controls shadow-intensity="1"></model-viewer>
<p id="state" role="status">3D 파일 로딩 중…</p></main>
<script>const m=document.getElementById('model');m.addEventListener('load',()=>document.getElementById('state').textContent='GLB 로딩 완료 · 100,000 삼각형 · 텍스처 포함');m.addEventListener('error',()=>document.getElementById('state').textContent='뷰어 로딩 실패');</script></html>
