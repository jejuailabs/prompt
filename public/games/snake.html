<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON SNAKE</title>
<style>
html,body{margin:0;height:100%;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative}
canvas{display:block;border-radius:12px;box-shadow:0 0 40px #34d39955;background:#0a0a1a;max-width:96vw;max-height:96vh}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-size:12px;letter-spacing:1px;text-shadow:0 0 6px #34d399;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,12,.74);color:#fff;text-align:center;backdrop-filter:blur(2px);border-radius:12px}
#overlay h1{margin:0 0 6px;font-size:24px;color:#34d399;letter-spacing:2px}
#overlay p{margin:3px 0;font-size:12px;color:#c9c2e0}
#overlay button{margin-top:14px;padding:10px 26px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#34d399,#059669);border:0;border-radius:999px;cursor:pointer}
#overlay button:hover{filter:brightness(1.15)}
.badge{font-size:10px;color:#8f86ad;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="400" height="400"></canvas>
  <div id="hud"><span id="hScore">SCORE 0</span><span id="hBest">BEST 0</span></div>
  <div id="overlay">
    <h1>NEON SNAKE</h1>
    <p>이동: ← → ↑ ↓ 또는 WASD</p>
    <p>모바일: 스와이프로 방향 전환</p>
    <button id="btnStart">게임 시작</button>
    <div class="badge">PLAYLAB SANDBOX · TIER 1 IFRAME ENGINE</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,G=20,CW=W/G,CH=H/G;
const overlay=document.getElementById('overlay'),hScore=document.getElementById('hScore'),hBest=document.getElementById('hBest');
let snake,dir,nextDir,food,score,best=0,running=false,timer=0,speed=120;
const colors=['#34d399','#6ee7b7','#a7f3d0','#d1fae5'];

function rand(max){return Math.floor(Math.random()*max);}
function reset(){snake=[{x:Math.floor(CW/2),y:Math.floor(CH/2)}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;speed=120;placeFood();}
function placeFood(){do{food={x:rand(CW),y:rand(CH)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}

function update(){
  if(!running)return;
  timer+=16;if(timer<speed)return;timer=0;
  dir={...nextDir};
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=CW||head.y<0||head.y>=CH||snake.some(s=>s.x===head.x&&s.y===head.y)){
    running=false;if(score>best)best=score;hBest.textContent='BEST '+best;
    overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelectorAll('p')[0].textContent=`점수: ${score}`;
    overlay.querySelector('button').textContent='다시 시작';overlay.style.display='flex';return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10;hScore.textContent='SCORE '+score;speed=Math.max(50,speed-2);placeFood();}
  else snake.pop();
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#1a2e1a';ctx.lineWidth=0.5;
  for(let x=0;x<=CW;x++){ctx.beginPath();ctx.moveTo(x*G,0);ctx.lineTo(x*G,H);ctx.stroke();}
  for(let y=0;y<=CH;y++){ctx.beginPath();ctx.moveTo(0,y*G);ctx.lineTo(W,y*G);ctx.stroke();}
  snake.forEach((s,i)=>{const c=colors[Math.min(i,colors.length-1)];ctx.fillStyle=c;ctx.shadowColor='#34d399';ctx.shadowBlur=i===0?12:4;ctx.beginPath();ctx.roundRect(s.x*G+1,s.y*G+1,G-2,G-2,4);ctx.fill();});
  ctx.shadowBlur=0;
  ctx.fillStyle='#f87171';ctx.shadowColor='#f87171';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((k==='arrowleft'||k==='a')&&dir.x!==1)nextDir={x:-1,y:0};
  if((k==='arrowright'||k==='d')&&dir.x!==-1)nextDir={x:1,y:0};
  if((k==='arrowup'||k==='w')&&dir.y!==1)nextDir={x:0,y:-1};
  if((k==='arrowdown'||k==='s')&&dir.y!==-1)nextDir={x:0,y:1};
  if(['arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x!==1)nextDir={x:1,y:0};if(dx<-20&&dir.x!==-1)nextDir={x:-1,y:0};}
  else{if(dy>20&&dir.y!==1)nextDir={x:0,y:1};if(dy<-20&&dir.y!==-1)nextDir={x:0,y:-1};}
});

document.getElementById('btnStart').onclick=()=>{reset();overlay.style.display='none';running=true;};
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
