<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON ARCHERY</title>
<style>
html,body{margin:0;height:100%;background:#0b0714;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative}
canvas{display:block;border-radius:12px;box-shadow:0 0 40px #f59e0b55;background:#0f1729;max-width:96vw;max-height:96vh}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-size:13px;letter-spacing:1px;text-shadow:0 0 6px #f59e0b;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,12,.78);color:#fff;text-align:center;backdrop-filter:blur(2px);border-radius:12px}
#overlay h1{margin:0 0 6px;font-size:26px;color:#f59e0b;letter-spacing:2px}
#overlay p{margin:3px 0;font-size:12px;color:#c9c2e0}
#overlay button{margin-top:14px;padding:10px 26px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#d97706);border:0;border-radius:999px;cursor:pointer}
#overlay button:hover{filter:brightness(1.15)}
.badge{font-size:10px;color:#8f86ad;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="400" height="500"></canvas>
  <div id="hud"><span id="hScore">SCORE 0</span><span id="hArrows">🏹 10</span><span id="hRound">ROUND 1</span></div>
  <div id="overlay">
    <h1>🏹 NEON ARCHERY</h1>
    <p>클릭/탭으로 활 쏘기!</p>
    <p>과녁 중앙에 가까울수록 고득점</p>
    <button id="btnStart">게임 시작</button>
    <div class="badge">PLAYLAB SANDBOX · TIER 1 IFRAME ENGINE</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const overlay=document.getElementById('overlay'),hScore=document.getElementById('hScore'),hArrows=document.getElementById('hArrows'),hRound=document.getElementById('hRound');
const ACCENT='#f59e0b';
const TARGET_X=W/2,TARGET_BASE_Y=180,TARGET_R=80;
const RING_COLORS=['#ef4444','#ef4444','#3b82f6','#3b82f6','#000','#000','#06b6d4','#06b6d4','#f59e0b','#f59e0b'];
const RING_SCORES=[1,1,2,2,3,3,5,5,8,10];

let score=0,arrows=10,round=1,gameState='idle',arrowsOnTarget=[],windSpeed=0,targetY=TARGET_BASE_Y,targetOscillation=0,aimX=W/2,aimY=TARGET_BASE_Y,shooting=false,arrowFly=null;

function resetRound(){
  arrowsOnTarget=[];arrows=10;
  windSpeed=(Math.random()-0.5)*3;
  targetOscillation=0;
}

function getScore(dist){
  const step=TARGET_R/10;
  for(let i=0;i<10;i++){if(dist<=step*(i+1))return RING_SCORES[9-i];}
  return 0;
}

function shoot(){
  if(shooting||arrows<=0)return;
  shooting=true;
  const startX=W/2,startY=H-60;
  arrowFly={x:startX,y:startY,targetX:aimX+windSpeed*12,targetY:aimY,t:0};
}

function update(dt){
  targetOscillation+=dt*1.5*(round>2?1.5:1);
  targetY=TARGET_BASE_Y+Math.sin(targetOscillation)*(10+round*3);
  aimX=W/2+Math.sin(targetOscillation*0.7)*20;
  aimY=targetY+Math.cos(targetOscillation*1.3)*10;

  if(arrowFly){
    arrowFly.t+=dt*3;
    if(arrowFly.t>=1){
      const fx=arrowFly.targetX,fy=arrowFly.targetY;
      const dist=Math.sqrt((fx-TARGET_X)**2+(fy-targetY)**2);
      const pts=getScore(dist);
      score+=pts;
      arrowsOnTarget.push({x:fx-TARGET_X,y:fy-targetY,pts});
      arrows--;
      hScore.textContent='SCORE '+score;
      hArrows.textContent='🏹 '+arrows;
      arrowFly=null;shooting=false;
      if(arrows<=0){
        if(score>=round*30){
          round++;hRound.textContent='ROUND '+round;
          resetRound();hArrows.textContent='🏹 '+arrows;
        } else {
          gameState='over';
          overlay.querySelector('h1').textContent='GAME OVER';
          overlay.querySelectorAll('p')[0].textContent='최종 점수: '+score+' · 라운드: '+round;
          overlay.querySelector('button').textContent='다시 도전';
          overlay.style.display='flex';
          try{window.parent.postMessage({type:'game-score',score},'*');}catch{}
        }
      }
    }
  }
}

function drawTarget(){
  ctx.save();ctx.translate(TARGET_X,targetY);
  for(let i=10;i>0;i--){
    const r=TARGET_R*(i/10);
    ctx.fillStyle=RING_COLORS[i-1];
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle='#fff3';ctx.lineWidth=0.5;
  for(let i=1;i<=10;i++){ctx.beginPath();ctx.arc(0,0,TARGET_R*(i/10),0,Math.PI*2);ctx.stroke();}
  arrowsOnTarget.forEach(a=>{
    ctx.fillStyle='#fff';ctx.shadowColor='#f59e0b';ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(a.x,a.y,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });
  ctx.restore();
}

function drawBow(){
  const bx=W/2,by=H-60;
  ctx.strokeStyle=ACCENT;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(bx,by,25,Math.PI*0.7,Math.PI*1.3);ctx.stroke();
  ctx.strokeStyle='#aaa';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx-22,by+12);ctx.lineTo(bx,by-8);ctx.lineTo(bx+22,by+12);ctx.stroke();
  if(!shooting){
    ctx.fillStyle='#fff';ctx.fillRect(bx-1,by-30,2,22);
    ctx.fillStyle=ACCENT;
    ctx.beginPath();ctx.moveTo(bx,by-32);ctx.lineTo(bx-4,by-26);ctx.lineTo(bx+4,by-26);ctx.closePath();ctx.fill();
  }
}

function drawCrosshair(){
  if(shooting)return;
  ctx.save();
  ctx.strokeStyle='#fff8';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(aimX-10,aimY);ctx.lineTo(aimX+10,aimY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(aimX,aimY-10);ctx.lineTo(aimX,aimY+10);ctx.stroke();
  ctx.beginPath();ctx.arc(aimX,aimY,6,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawWind(){
  ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';
  const dir=windSpeed>0?'→':'←';const str=Math.abs(windSpeed).toFixed(1);
  ctx.fillText('바람 '+dir+' '+str,W/2,H-20);
}

function drawArrowFly(){
  if(!arrowFly)return;
  const t=arrowFly.t;
  const x=arrowFly.x+(arrowFly.targetX-arrowFly.x)*t;
  const y=arrowFly.y+(arrowFly.targetY-arrowFly.y)*t-Math.sin(t*Math.PI)*80;
  ctx.fillStyle='#fff';ctx.shadowColor=ACCENT;ctx.shadowBlur=8;
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

function draw(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f1729');grad.addColorStop(0.6,'#1a1040');grad.addColorStop(1,'#0f1729');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  drawTarget();drawBow();drawCrosshair();drawWind();drawArrowFly();
}

let last=0;
function loop(ts){
  if(gameState!=='playing'){draw();requestAnimationFrame(loop);return;}
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  update(dt);draw();
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerup',e=>{
  if(gameState==='playing')shoot();
});

document.getElementById('btnStart').onclick=()=>{
  score=0;round=1;gameState='playing';
  hScore.textContent='SCORE 0';hRound.textContent='ROUND 1';
  resetRound();hArrows.textContent='🏹 '+arrows;
  overlay.style.display='none';last=performance.now();
};

requestAnimationFrame(loop);
</script>
</body>
</html>
