<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일곱 냥이 · PLAYLAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f4edf6;color:#51435d;font-family:system-ui,sans-serif}header{max-width:1080px;margin:auto;padding:44px 24px 22px}small{letter-spacing:3px;font-size:10px;color:#a587af}h1{font-size:34px;margin:12px 0}header p{font-size:14px;color:#8b7898;line-height:1.8}.grid{max-width:1080px;margin:auto;padding:0 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fffc;border:1px solid white;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px #866f9510}.card img{width:100%;display:block}.copy{padding:0 20px 22px}.copy h2{font-size:17px}.copy p{font-size:12px;color:#91819d;line-height:1.7}.floor{font-size:10px;color:#b08abb}a{color:#80618f;text-decoration:none}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}nav a{border:1px solid #dccccf;border-radius:20px;padding:8px 14px;font-size:12px}</style></head><body><header><small>PLAYLAB / SEVEN LITTLE FRIENDS</small><h1>일곱 냥이, 한 마리씩 만나봐요.</h1><p>색·귀·얼굴·털·꼬리가 다른 일곱 품종의 두툼한 3D 캐릭터.<br>프리즘 타워에서는 높이 쌓을수록 새 친구가 등장해요.</p><nav><a href="./index.html">프리즘 타워</a><a href="../cat-bounce/index.html">충전 점프</a><a href="../cat-flip/index.html">냥이 뒤집기</a><a href="../cat-pack/index.html">상자 포장</a></nav></header><main class="grid"></main><script type="module">import{BREEDS}from'./breeds.mjs';const grid=document.querySelector('.grid');for(const breed of BREEDS){const card=document.createElement('article');card.className='card';card.innerHTML='<img src="./assets/breeds/'+breed.id+'.png" alt="'+breed.name+' 3D 캐릭터"><div class="copy"><span class="floor">'+breed.from+'층부터 등장</span><h2>'+breed.name+'</h2><p>'+breed.description+'</p></div>';grid.append(card);}</script></body></html>
