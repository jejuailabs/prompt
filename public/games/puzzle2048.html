<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON 2048</title>
<style>
html,body{margin:0;height:100%;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative}
canvas{display:block;border-radius:12px;box-shadow:0 0 40px #8b5cf655;background:#0a0a1a;max-width:96vw;max-height:96vh}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-size:13px;letter-spacing:1px;text-shadow:0 0 6px #8b5cf6;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,12,.78);color:#fff;text-align:center;backdrop-filter:blur(2px);border-radius:12px}
#overlay h1{margin:0 0 6px;font-size:26px;color:#8b5cf6;letter-spacing:2px}
#overlay p{margin:3px 0;font-size:12px;color:#c9c2e0}
#overlay button{margin-top:14px;padding:10px 26px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:0;border-radius:999px;cursor:pointer}
#overlay button:hover{filter:brightness(1.15)}
.badge{font-size:10px;color:#8f86ad;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="400" height="460"></canvas>
  <div id="hud"><span id="hScore">SCORE 0</span><span id="hBest">BEST 0</span></div>
  <div id="overlay">
    <h1>NEON 2048</h1>
    <p>방향키 / WASD / 스와이프로 타일 이동</p>
    <p>같은 숫자를 합쳐 2048을 만드세요!</p>
    <button id="btnStart">게임 시작</button>
    <div class="badge">PLAYLAB SANDBOX · TIER 1 IFRAME ENGINE</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,N=4,PAD=8,TOP=50;
const CELL=(W-PAD*(N+1))/N;
const overlay=document.getElementById('overlay'),hScore=document.getElementById('hScore'),hBest=document.getElementById('hBest');

const TILE_COLORS={
  2:'#64748b',4:'#475569',8:'#f97316',16:'#ea580c',32:'#ef4444',64:'#dc2626',
  128:'#eab308',256:'#ca8a04',512:'#84cc16',1024:'#22c55e',2048:'#8b5cf6',4096:'#a855f7',8192:'#ec4899'
};
const TILE_TEXT_COLORS={2:'#fff',4:'#fff',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#000',256:'#000',512:'#000',1024:'#fff',2048:'#fff',4096:'#fff',8192:'#fff'};

let grid=[],score=0,best=0,gameState='idle',moved=false;
try{best=parseInt(localStorage.getItem('2048-best')||'0');}catch{}
hBest.textContent='BEST '+best;

function init(){
  grid=Array.from({length:N},()=>Array(N).fill(0));
  score=0;hScore.textContent='SCORE 0';
  addTile();addTile();
}
function addTile(){
  const empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])empty.push({r,c});
  if(!empty.length)return;
  const{r,c}=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function clone(g){return g.map(r=>[...r]);}

function slideRow(row){
  let a=row.filter(v=>v),merged=[];
  for(let i=0;i<a.length;i++){
    if(i<a.length-1&&a[i]===a[i+1]){
      const v=a[i]*2;merged.push(v);score+=v;i++;
    } else merged.push(a[i]);
  }
  while(merged.length<N)merged.push(0);
  return merged;
}

function move(dir){
  const prev=clone(grid);
  if(dir==='left'){for(let r=0;r<N;r++)grid[r]=slideRow(grid[r]);}
  else if(dir==='right'){for(let r=0;r<N;r++){grid[r]=slideRow([...grid[r]].reverse()).reverse();}}
  else if(dir==='up'){for(let c=0;c<N;c++){let col=[];for(let r=0;r<N;r++)col.push(grid[r][c]);col=slideRow(col);for(let r=0;r<N;r++)grid[r][c]=col[r];}}
  else if(dir==='down'){for(let c=0;c<N;c++){let col=[];for(let r=N-1;r>=0;r--)col.push(grid[r][c]);col=slideRow(col);for(let r=N-1,i=0;r>=0;r--,i++)grid[r][c]=col[i];}}
  let changed=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]!==prev[r][c])changed=true;
  if(changed){
    addTile();
    hScore.textContent='SCORE '+score;
    if(score>best){best=score;try{localStorage.setItem('2048-best',best.toString());}catch{}hBest.textContent='BEST '+best;}
    if(isGameOver()){
      gameState='over';
      overlay.querySelector('h1').textContent='GAME OVER';
      overlay.querySelectorAll('p')[0].textContent='최종 점수: '+score;
      overlay.querySelector('button').textContent='다시 도전';
      overlay.style.display='flex';
      try{window.parent.postMessage({type:'game-score',score},'*');}catch{}
    }
  }
}

function isGameOver(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c])return false;
    if(c<N-1&&grid[r][c]===grid[r][c+1])return false;
    if(r<N-1&&grid[r][c]===grid[r+1][c])return false;
  }
  return true;
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();ctx.roundRect(PAD/2,TOP-PAD/2,W-PAD,N*(CELL+PAD)+PAD,12);ctx.fill();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const x=PAD+c*(CELL+PAD),y=TOP+r*(CELL+PAD);
    const v=grid[r][c];
    if(v){
      const col=TILE_COLORS[v]||'#7c3aed';
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=v>=128?12:4;
      ctx.beginPath();ctx.roundRect(x,y,CELL,CELL,8);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle=TILE_TEXT_COLORS[v]||'#fff';
      const fs=v>=1024?20:v>=128?24:28;
      ctx.font='bold '+fs+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x+CELL/2,y+CELL/2+1);
    } else {
      ctx.fillStyle='#252540';ctx.beginPath();ctx.roundRect(x,y,CELL,CELL,8);ctx.fill();
    }
  }
}

document.addEventListener('keydown',e=>{
  if(gameState!=='playing')return;
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){e.preventDefault();move('left');}
  else if(k==='arrowright'||k==='d'){e.preventDefault();move('right');}
  else if(k==='arrowup'||k==='w'){e.preventDefault();move('up');}
  else if(k==='arrowdown'||k==='s'){e.preventDefault();move('down');}
  draw();
});

let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  if(gameState!=='playing')return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){move(dx>0?'right':'left');}
  else{move(dy>0?'down':'up');}
  draw();
});

document.getElementById('btnStart').onclick=()=>{
  init();gameState='playing';overlay.style.display='none';draw();
};
draw();
</script>
</body>
</html>
