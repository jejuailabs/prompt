<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BRICK BREAKER</title>
<style>
html,body{margin:0;height:100%;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:relative}
canvas{display:block;border-radius:12px;box-shadow:0 0 40px #f472b655;background:#0f0f2a;max-width:96vw;max-height:96vh}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-size:12px;letter-spacing:1px;text-shadow:0 0 6px #f472b6;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,12,.74);color:#fff;text-align:center;backdrop-filter:blur(2px);border-radius:12px}
#overlay h1{margin:0 0 6px;font-size:24px;color:#f472b6;letter-spacing:2px}
#overlay p{margin:3px 0;font-size:12px;color:#c9c2e0}
#overlay button{margin-top:14px;padding:10px 26px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f472b6,#be185d);border:0;border-radius:999px;cursor:pointer}
#overlay button:hover{filter:brightness(1.15)}
.badge{font-size:10px;color:#8f86ad;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="560"></canvas>
  <div id="hud"><span id="hScore">SCORE 0</span><span id="hLives">♥♥♥</span></div>
  <div id="overlay">
    <h1>BRICK BREAKER</h1>
    <p>조종: 마우스 / 터치 = 패들 이동</p>
    <p>벽돌을 모두 부수면 다음 레벨!</p>
    <button id="btnStart">게임 시작</button>
    <div class="badge">PLAYLAB SANDBOX · TIER 1 IFRAME ENGINE</div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const overlay=document.getElementById('overlay'),btnStart=document.getElementById('btnStart');
const hScore=document.getElementById('hScore'),hLives=document.getElementById('hLives');

let score=0,lives=3,level=1,running=false,gameOver=false;
let paddle={x:W/2-40,y:H-30,w:80,h:12};
let ball={x:W/2,y:H-45,r:6,dx:3,dy:-3,speed:4};
let bricks=[];
const COLS=8,ROWS=5,BW=52,BH=18,BPAD=4,BTOP=50,BLEFT=(W-COLS*(BW+BPAD)+BPAD)/2;
const colors=['#f472b6','#a78bfa','#60a5fa','#34d399','#fbbf24','#fb923c','#f87171','#e879f9'];

function makeBricks(){
  bricks=[];
  for(let r=0;r<ROWS+Math.min(level-1,3);r++)for(let c=0;c<COLS;c++){
    bricks.push({x:BLEFT+c*(BW+BPAD),y:BTOP+r*(BH+BPAD),w:BW,h:BH,color:colors[(r+level)%colors.length],alive:true,hits:r<Math.floor(level/3)?2:1});
  }
}

function resetBall(){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-10;ball.dx=(Math.random()-.5)*4;ball.dy=-ball.speed;if(Math.abs(ball.dx)<1)ball.dx=ball.dx<0?-1.5:1.5;}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1a1a3e';ctx.fillRect(0,0,W,H);
  for(const b of bricks)if(b.alive){ctx.fillStyle=b.hits>1?'#fff':b.color;ctx.shadowColor=b.color;ctx.shadowBlur=6;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();ctx.shadowBlur=0;if(b.hits>1){ctx.fillStyle=b.color;ctx.globalAlpha=.6;ctx.beginPath();ctx.roundRect(b.x+2,b.y+2,b.w-4,b.h-4,3);ctx.fill();ctx.globalAlpha=1;}}
  ctx.fillStyle='#f472b6';ctx.shadowColor='#f472b6';ctx.shadowBlur=10;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.shadowColor='#f472b6';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
}

function update(){
  if(!running)return;
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0||ball.x+ball.r>W)ball.dx*=-1;
  if(ball.y-ball.r<0)ball.dy*=-1;
  if(ball.y+ball.r>H){lives--;hLives.textContent='♥'.repeat(Math.max(0,lives));if(lives<=0){gameOver=true;running=false;showOverlay('GAME OVER',`최종 점수: ${score}`);return;}resetBall();}
  if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.dx=hit*5;}
  for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){ball.dy*=-1;b.hits--;if(b.hits<=0){b.alive=false;score+=10*level;}}}
  hScore.textContent=`SCORE ${score}`;
  if(bricks.every(b=>!b.alive)){level++;ball.speed=Math.min(8,4+level*.5);makeBricks();resetBall();}
}

function showOverlay(title,desc){overlay.style.display='flex';overlay.querySelector('h1').textContent=title;overlay.querySelector('p').textContent=desc;btnStart.textContent=gameOver?'다시 시작':'게임 시작';}

function startGame(){overlay.style.display='none';if(gameOver){score=0;lives=3;level=1;ball.speed=4;gameOver=false;hLives.textContent='♥♥♥';}makeBricks();resetBall();running=true;}

btnStart.onclick=startGame;
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*(W/r.width)-paddle.w/2));});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(t.clientX-r.left)*(W/r.width)-paddle.w/2));},{passive:false});

(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
